[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epimetheus-core"
version = "0.1.0"
description = "Epimetheus Red shared scanner core: regex + tree-sitter AST context + LLM classifier secret detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Epimetheus Red contributors" }]
keywords = ["security", "secret-detection", "llm", "owasp", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# Only hard dependency is the tree-sitter runtime, which the issue-defined
# detection methodology (Stage 2 AST context filtering) requires. Everything
# else uses the Python standard library so the core stays vendor-neutral.
dependencies = ["tree-sitter>=0.22,<0.27"]

[project.optional-dependencies]
# Language grammars are optional: the scanner degrades gracefully (reports
# ast_verified=false) for languages whose grammar is not installed.
grammars = [
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-json>=0.21",
]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
epimetheus = "epimetheus_core.cli:main"

[tool.setuptools.packages.find]
include = ["epimetheus_core*"]

[tool.setuptools.package-data]
epimetheus_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
